name: Fenrir Read build

# Every day: check for a new official Nuvio or Tsundoku *release*. Only when there is one, merge it,
# build Fenrir Read and publish the APK (the app's own updater and Obtainium pick it up).
# Can also be started by hand.
# If an official update clashes with Fenrir's changes, it is skipped, the rest still builds, and an
# issue is opened so the clash can be fixed by hand.
on:
  schedule:
    - cron: "17 9 * * *"   # daily, 09:17 UTC (about 4 AM New York)
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if there is no new official Nuvio or Tsundoku update"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

concurrency:
  group: fenrir-build
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/NuvioMedia/NuvioMobile.git
  TSUNDOKU_UPSTREAM: https://github.com/tsundoku-otaku/tsundoku.git
  BRANCH: read-mode

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Get Fenrir code
        uses: actions/checkout@v5
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
          submodules: false

      - name: Get Read side (Tsundoku)
        run: git submodule update --init tsundoku

      - name: Merge official Nuvio updates
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "fenrir-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Follow official Nuvio *releases* (version tags), not every day's code changes.
          UP_BRANCH=$(git ls-remote --tags "$UPSTREAM" | grep -v '\^{}' | awk '{sub("refs/tags/","",$2); print $2}' \
            | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+' \
            | awk '{k=$0; sub(/^v/,"",k); sub(/-/,"~",k); print k" "$0}' | sort -V -k1,1 | tail -n1 | cut -d' ' -f2)
          echo "Latest official Nuvio release: $UP_BRANCH"
          git fetch --no-tags "$UPSTREAM" "refs/tags/$UP_BRANCH"
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "No new official Nuvio release."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif git merge --no-edit -m "Merge official Nuvio release $UP_BRANCH" FETCH_HEAD; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            FILES=$(git diff --name-only --diff-filter=U)
            git merge --abort
            echo "::warning::The official Nuvio update clashes with Fenrir's changes; building without it."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            TITLE="Official Nuvio update needs a manual merge"
            if [ -z "$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number')" ]; then
              gh issue create --title "$TITLE" --body "$(printf 'The daily build could not merge the latest official Nuvio update (%s) because these files clash with Fenrir'"'"'s changes:\n\n%s\n\nFenrir Read keeps building without that update until the clash is fixed.' "$(git rev-parse --short FETCH_HEAD)" "$FILES")"
            fi
          fi

      - name: Merge official Tsundoku updates
        id: tsundoku
        env:
          GH_TOKEN: ${{ github.token }}
          TSUNDOKU_PUSH_TOKEN: ${{ secrets.TSUNDOKU_PUSH_TOKEN }}
        run: |
          cd tsundoku
          git config user.name "fenrir-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B nuvio-embed
          # Follow official Tsundoku *releases* (version tags), not every code change.
          T_BRANCH=$(git ls-remote --tags "$TSUNDOKU_UPSTREAM" | grep -v '\^{}' | awk '{sub("refs/tags/","",$2); print $2}' \
            | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+' \
            | awk '{k=$0; sub(/^v/,"",k); sub(/-/,"~",k); print k" "$0}' | sort -V -k1,1 | tail -n1 | cut -d' ' -f2)
          echo "Latest official Tsundoku release: $T_BRANCH"
          git fetch --no-tags "$TSUNDOKU_UPSTREAM" "refs/tags/$T_BRANCH"
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "No new official Tsundoku release."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif git merge --no-edit -m "Merge official Tsundoku release $T_BRANCH" FETCH_HEAD; then
            # Only count it as new once: remember which official Tsundoku version was last built.
            NEW=$(git rev-parse FETCH_HEAD)
            OLD=$(cat ../.github/fenrir/tsundoku-upstream.txt 2>/dev/null || true)
            if [ "$NEW" != "$OLD" ]; then
              mkdir -p ../.github/fenrir && echo "$NEW" > ../.github/fenrir/tsundoku-upstream.txt
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "Official Tsundoku update was already built; merged again for this build."
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
            # Save the merge to the Read-side repository when a token for it is set up.
            if [ -n "$TSUNDOKU_PUSH_TOKEN" ]; then
              git push "https://x-access-token:${TSUNDOKU_PUSH_TOKEN}@github.com/fenrirfen-cell/tsundoku1.0.0.git" HEAD:nuvio-embed \
                && echo "saved=true" >> "$GITHUB_OUTPUT" \
                || echo "::warning::Couldn't save the Tsundoku merge; it is still used for this build."
            else
              echo "Merged for this build only (add a TSUNDOKU_PUSH_TOKEN secret to save it)."
            fi
          else
            FILES=$(git diff --name-only --diff-filter=U)
            git merge --abort
            echo "::warning::The official Tsundoku update clashes with Fenrir's changes; building without it."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            cd ..
            TITLE="Official Tsundoku update needs a manual merge"
            if [ -z "$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number')" ]; then
              gh issue create --title "$TITLE" --body "$(printf 'The daily build could not merge the latest official Tsundoku update (%s) because these files clash with Fenrir'"'"'s Read-side changes:\n\n%s\n\nFenrir Read keeps building without that update until the clash is fixed.' "$(git -C tsundoku rev-parse --short FETCH_HEAD)" "$FILES")"
            fi
          fi

      - name: Decide whether to build
        id: go
        run: |
          if [ "${{ steps.merge.outputs.changed }}" = "true" ] || [ "${{ steps.tsundoku.outputs.changed }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Nothing new - skipping build."
          fi

      - name: Set up Java 25
        if: steps.go.outputs.build == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        if: steps.go.outputs.build == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Keys and signing key
        if: steps.go.outputs.build == 'true'
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$LOCAL_PROPERTIES" ] || [ -z "$DEBUG_KEYSTORE_B64" ]; then
            echo "::error::Secrets LOCAL_PROPERTIES and DEBUG_KEYSTORE_B64 must be set (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          # Strip Windows line endings / stray spaces picked up when pasting
          printf '%s\n' "$LOCAL_PROPERTIES" | tr -d '\r' | sed 's/^[[:space:]]*//' | grep -v '^sdk.dir' > local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
          echo "Keys file has $(grep -c '=' local.properties) settings."
          mkdir -p "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE_B64" | tr -d '\r\n\t \"' > /tmp/ks.b64
          if ! base64 -d /tmp/ks.b64 > "$HOME/.android/debug.keystore" 2>/dev/null; then
            echo "::error::DEBUG_KEYSTORE_B64 is not valid. It should be one long line of letters/numbers starting with something like MIIK or /u3+7Q. Re-copy it with the PowerShell command and paste it again."
            echo "It starts with: $(head -c 6 /tmp/ks.b64)... and is $(wc -c < /tmp/ks.b64) characters long."
            exit 1
          fi
          echo "Signing key OK ($(wc -c < "$HOME/.android/debug.keystore") bytes)."
          echo "ANDROID_USER_HOME=$HOME/.android" >> "$GITHUB_ENV"

      - name: Build Fenrir Read
        if: steps.go.outputs.build == 'true'
        env:
          # Optional: your own Sentry crash-report address. Empty = crash reports stay off.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          chmod +x gradlew
          ./gradlew :androidApp:assembleFullFast --stacktrace

      - name: Save merged code
        if: steps.go.outputs.build == 'true' && (steps.merge.outputs.changed == 'true' || steps.tsundoku.outputs.changed == 'true')
        # Can't save when the official update touches Nuvio's own workflow files (GitHub blocks
        # that for this token). The APK is still published; tomorrow's run merges again.
        continue-on-error: true
        run: |
          if [ "${{ steps.tsundoku.outputs.saved }}" = "true" ]; then
            git add tsundoku
          fi
          git add .github/fenrir/tsundoku-upstream.txt 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Read side: official Tsundoku updates"
          git push origin "HEAD:$BRANCH"

      - name: Check app icon (Android's own tool)
        if: steps.go.outputs.build == 'true'
        continue-on-error: true
        run: |
          APK=$(ls androidApp/build/outputs/apk/full/fast/*.apk | head -n1)
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n1)
          echo "== badging"; "$AAPT2" dump badging "$APK" | grep -iE "^package|icon|launchable" | head -40
          echo "== launcher resources"; "$AAPT2" dump resources "$APK" | grep -iA12 "mipmap/ic_launcher_fenrir " | head -60

      - name: Publish release
        if: steps.go.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -m1 '^MARKETING_VERSION' iosApp/Configuration/Version.xcconfig | cut -d= -f2 | tr -d ' \r')
          [ -z "$VER" ] && VER=build
          TAG="fenrir-${VER}-r${GITHUB_RUN_NUMBER}"
          APK=$(ls androidApp/build/outputs/apk/full/fast/*.apk | head -n1)
          cp "$APK" "FenrirRead-${VER}-r${GITHUB_RUN_NUMBER}.apk"
          NOTES="Fenrir Vault built from official Nuvio ${VER} and Tsundoku $(git -C tsundoku rev-parse --short HEAD). Commit: $(git rev-parse --short HEAD)"
          # "What's new" (shown in the app after updating): whats-new.md, only when it changed since the last release.
          PREV=$(gh release list --limit 20 --json tagName --jq '.[].tagName' | grep '^fenrir-' | head -n1 || true)
          if [ -f whats-new.md ] && { [ -z "$PREV" ] || ! git diff --quiet "$PREV" HEAD -- whats-new.md 2>/dev/null; }; then
            NOTES="$(printf "## What's new\n%s\n\n%s" "$(grep -E '^[-*] ' whats-new.md)" "$NOTES")"
          fi
          gh release create "$TAG" "FenrirRead-${VER}-r${GITHUB_RUN_NUMBER}.apk" \
            --title "Fenrir Vault ${VER} (build ${GITHUB_RUN_NUMBER})" --notes "$NOTES" --target "$(git rev-parse HEAD)"
          # keep only the 5 newest Fenrir releases
          gh release list --limit 100 --json tagName --jq '.[].tagName' | grep '^fenrir-' | tail -n +6 | \
            while read -r old; do gh release delete "$old" --yes --cleanup-tag; done
