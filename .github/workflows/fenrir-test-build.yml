name: Fenrir test build

# Builds the APK from a fix/* branch so a change can be tried before it's merged.
# Nothing is published: the APK is attached to the run (Artifacts, kept 7 days).
on:
  push:
    branches: ["fix/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fenrir-test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Get Fenrir code
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Get Read side (Tsundoku)
        run: git submodule update --init tsundoku

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Keys and signing key
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$LOCAL_PROPERTIES" ] || [ -z "$DEBUG_KEYSTORE_B64" ]; then
            echo "::error::Secrets LOCAL_PROPERTIES and DEBUG_KEYSTORE_B64 must be set (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          printf '%s\n' "$LOCAL_PROPERTIES" | tr -d '\r' | sed 's/^[[:space:]]*//' | grep -v '^sdk.dir' > local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
          mkdir -p "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE_B64" | tr -d '\r\n\t \"' | base64 -d > "$HOME/.android/debug.keystore"
          echo "ANDROID_USER_HOME=$HOME/.android" >> "$GITHUB_ENV"

      - name: Build Fenrir Read
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          chmod +x gradlew
          ./gradlew :androidApp:assembleFullFast --stacktrace

      - name: Attach the APK to this run
        uses: actions/upload-artifact@v4
        with:
          name: FenrirRead-test-${{ github.run_number }}
          path: androidApp/build/outputs/apk/full/fast/*.apk
          if-no-files-found: error
          retention-days: 7
