name: PR Full Debug Build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [cmp-rewrite, read-mode]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-full-debug-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-debug-build:
    name: Build fullDebug APK
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout Read mode dependency
        run: git submodule update --init tsundoku

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare runtime properties
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
        run: |
          # Use the same client-side configuration as the Fenrir release build.
          # Only include settings already embedded in the published Android app.
          if [ -n "$LOCAL_PROPERTIES" ]; then
            printf '%s\n' "$LOCAL_PROPERTIES" | tr -d '\r' | sed 's/^[[:space:]]*//'
          elif [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode
          fi | grep -E '^(NUVIO_SUPABASE_URL|NUVIO_SUPABASE_ANON_KEY|NUVIO_SUPABASE_FALLBACK_URL|TMDB_API_KEY)[[:space:]]*=' > local.properties || true
          if ! grep -qE '^NUVIO_SUPABASE_URL[[:space:]]*=[[:space:]]*[^[:space:]]' local.properties || ! grep -qE '^NUVIO_SUPABASE_ANON_KEY[[:space:]]*=[[:space:]]*[^[:space:]]' local.properties; then
            echo '::error::Missing Nuvio client sign-in configuration; configure the same runtime properties used by the official APK.'
            exit 1
          fi

      - name: Build fullDebug APK
        run: ./gradlew :androidApp:assembleFullDebug -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore --stacktrace

      - name: Upload fullDebug APK
        uses: actions/upload-artifact@v7
        with:
          path: androidApp/build/outputs/apk/full/debug/androidApp-full-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Run Android host unit tests
        run: ./gradlew :composeApp:testAndroidHostTest -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore --stacktrace
